<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Quadro em Branco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Conceito: tela infinita pontilhada, interface em painéis brancos flutuantes (trilho de ferramentas à esquerda,
   barra contextual sobre a seleção, minimapa e zoom no canto). A cor fica reservada para as marcas de quem usa. */
:root{
  --bg:#f4f5f8; --dot:#cdd1da; --panel:#ffffff; --line:#e1e4ea; --hover:#eef0f5;
  --ink:#1d2127; --muted:#667085; --accent:#4262ff; --accent-ink:#ffffff; --accent-soft:#e8ecff; --sel:#4262ff;
  --frame:rgba(255,255,255,.65); --frame-line:#c4c9d4;
  --shadow:0 1px 2px rgba(20,24,40,.08),0 6px 20px rgba(20,24,40,.10);
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161b; --dot:#2b2f38; --panel:#22252d; --line:#363b46; --hover:#2d313b;
    --ink:#e9ebef; --muted:#9aa1ae; --accent:#8ea2ff; --accent-ink:#0d1226; --accent-soft:#2a3354; --sel:#8ea2ff;
    --frame:rgba(255,255,255,.04); --frame-line:#4a505d;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 6px 20px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14161b; --dot:#2b2f38; --panel:#22252d; --line:#363b46; --hover:#2d313b;
  --ink:#e9ebef; --muted:#9aa1ae; --accent:#8ea2ff; --accent-ink:#0d1226; --accent-soft:#2a3354; --sel:#8ea2ff;
  --frame:rgba(255,255,255,.04); --frame-line:#4a505d;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 6px 20px rgba(0,0,0,.35); color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
#stage{position:relative;width:100%;height:100%;overflow:hidden}
#board{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.tb{width:40px;height:40px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;cursor:pointer;flex:none;padding:0;position:relative}
.tb:hover:not(:disabled){background:var(--hover)}
.tb:disabled{opacity:.35;cursor:default}
.tb[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tb:focus-visible,.sw:focus-visible,.txt:focus-visible,.opt:focus-visible,.mi:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tb svg,.opt svg,.mi svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.tb .caret{position:absolute;right:3px;bottom:3px;width:5px;height:5px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;opacity:.45}
.sep{width:1px;align-self:stretch;background:var(--line);margin:6px 3px;flex:none}
.hsep{height:1px;background:var(--line);margin:4px 6px;flex:none}
.rail{position:absolute;left:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;max-height:calc(100% - 150px);overflow-y:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.topleft{position:absolute;top:16px;left:16px;display:flex;align-items:center;gap:2px;padding:4px;max-width:calc(100% - 140px)}
.topleft .tb{width:34px;height:34px}
.title{border:0;background:transparent;color:var(--ink);font:600 14px var(--ui);padding:6px 8px;border-radius:8px;width:180px;min-width:0;-webkit-user-select:text;user-select:text}
.title:hover{background:var(--hover)}
.title:focus{outline:2px solid var(--accent);background:var(--panel)}
.topright{position:absolute;top:16px;right:16px;display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#2fa56b;flex:none}
.dot[data-s="saving"],.dot[data-s="connecting"]{background:#f08a24}
.dot[data-s="local"]{background:#8b93a1}
.dot[data-s="error"]{background:#e5484d}
.zoombar{position:absolute;right:16px;bottom:16px;display:flex;align-items:center;gap:2px;padding:4px}
.zoombar .tb{width:32px;height:32px}
.txt{height:32px;border:0;background:transparent;color:var(--muted);border-radius:8px;cursor:pointer;font:500 12px var(--ui);padding:0 8px;font-variant-numeric:tabular-nums}
.txt:hover{background:var(--hover);color:var(--ink)}
.zlab{min-width:46px;text-align:center}
#mini{position:absolute;right:16px;bottom:64px;width:176px;height:112px;overflow:hidden;cursor:pointer;touch-action:none}
#mini canvas{width:100%;height:100%;display:block}
.hint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center;padding:0 88px}
.hint h1{font:600 20px var(--ui);margin:0 0 6px;text-wrap:balance}
.hint p{margin:0 auto;color:var(--muted);max-width:42ch;text-wrap:balance}
.pop{position:absolute;z-index:20;padding:8px;min-width:0}
.pop h4{margin:2px 6px 8px;font:600 11px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,40px);gap:2px}
.row{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.opt{width:40px;height:40px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;cursor:pointer;padding:0}
.opt:hover{background:var(--hover)}
.opt[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.opt.wide{width:auto;padding:0 10px;font:500 13px var(--ui);display:flex;gap:8px;align-items:center;height:36px}
.swrow{display:flex;gap:8px;padding:6px;flex-wrap:wrap;max-width:260px}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;flex:none;position:relative}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.sw.none{background:linear-gradient(135deg,transparent 45%,#e5484d 45%,#e5484d 55%,transparent 55%),var(--panel)}
.tpl{display:flex;flex-direction:column;gap:2px;min-width:230px}
.tpl .mi{height:auto;padding:8px 10px;align-items:flex-start;flex-direction:column;gap:0}
.tpl .mi small{color:var(--muted);font-size:12px;font-weight:400}
.mi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;border-radius:8px;height:36px;padding:0 10px;cursor:pointer;text-align:left;font:500 13px var(--ui);white-space:nowrap}
.mi:hover{background:var(--hover)}
.mi kbd{margin-left:auto;color:var(--muted);font:12px var(--ui)}
.ctx{position:absolute;z-index:15;display:flex;align-items:center;gap:2px;padding:4px;max-width:calc(100% - 32px)}
.ctx .tb{width:34px;height:34px}
.ctx .tb svg{width:18px;height:18px}
.ctx .chip{width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 1px var(--line);display:block}
.ctx .chip.none{background:linear-gradient(135deg,transparent 42%,#e5484d 42%,#e5484d 58%,transparent 58%),var(--panel)}
.ctx .num{font:600 13px var(--ui);font-variant-numeric:tabular-nums}
.ctx.moving{opacity:0;pointer-events:none}
.sub{position:absolute;left:0;top:calc(100% + 8px);padding:6px;z-index:16}
.sub.up{top:auto;bottom:calc(100% + 8px)}
.ed{position:absolute;margin:0;padding:0;border:0;outline:1.5px solid var(--accent);outline-offset:3px;background:transparent;resize:none;overflow:hidden;white-space:pre-wrap;word-break:break-word;z-index:12;-webkit-user-select:text;user-select:text;font-family:var(--ui);box-sizing:content-box}
.modal{position:absolute;inset:0;z-index:40;background:rgba(10,12,20,.45);display:grid;place-items:center;padding:16px}
.modal .box{padding:20px;max-width:520px;width:100%;max-height:100%;overflow:auto}
.modal h2{margin:0 0 12px;font:600 18px var(--ui)}
.keys{display:grid;grid-template-columns:1fr auto;gap:6px 24px;font-size:13px}
.keys kbd{font:500 12px var(--ui);background:var(--hover);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.toast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);z-index:50;padding:8px 14px;font-size:13px;pointer-events:none;max-width:calc(100% - 32px)}
@media (max-width:640px){
  .rail{left:16px;right:16px;top:auto;bottom:16px;transform:none;flex-direction:row;max-height:none;overflow-x:auto;overflow-y:hidden;justify-content:flex-start}
  .rail .hsep{width:1px;height:auto;align-self:stretch;margin:6px 3px}
  .hint{padding:0 24px 80px}
  #mini{display:none}
  .zoombar{bottom:auto;top:64px}
  .topright{padding:4px}
  .topright #stext,.topright .dot{display:none}
  .title{width:120px}
  .toast{bottom:84px}
}

/* ----- tickets de pesquisa ----- */
:root{--ok:#1f8a55;--ok-soft:#e3f5ea;--bad:#d83a3f;--bad-soft:#fde8e8;--wait:#b8650a;--wait-soft:#fdf0dc}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ok:#4cc68a;--ok-soft:#173527;--bad:#ff7b80;--bad-soft:#3d1d20;--wait:#f2a54a;--wait-soft:#3a2a14}}
:root[data-theme="dark"]{--ok:#4cc68a;--ok-soft:#173527;--bad:#ff7b80;--bad-soft:#3d1d20;--wait:#f2a54a;--wait-soft:#3a2a14}
#stage.tk-open .topright,#stage.tk-open .zoombar,#stage.tk-open #mini{right:388px}
.topright{gap:10px}
.tkbtn{display:flex;align-items:center;gap:6px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;height:30px;padding:0 10px;cursor:pointer;font:600 12px var(--ui)}
.tkbtn .n{background:var(--accent-ink);color:var(--accent);border-radius:10px;padding:0 6px;font-size:11px;line-height:16px;font-variant-numeric:tabular-nums}
.tkbtn .n:empty{display:none}
.tkbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tk{position:absolute;top:16px;right:16px;bottom:16px;width:356px;z-index:18;display:flex;flex-direction:column;overflow:hidden}
#tk header{display:flex;align-items:center;gap:6px;padding:12px 10px 8px 16px}
#tk header h2{margin:0;font:600 15px var(--ui);flex:1}
#tk .tb{width:32px;height:32px}
#tk .tb svg{width:18px;height:18px}
.filters{display:flex;flex-direction:column;gap:12px;padding:0 16px 12px}
.fgrp{display:flex;flex-direction:column;gap:5px;min-width:0}
.flab{font:600 11px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;padding:2px;border:1px solid var(--line);border-radius:9px;background:var(--hover)}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:0;color:var(--muted);font:500 12px/1.25 var(--ui)}
.seg button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button b{font:600 15px/1.25 var(--ui);color:var(--ink);font-variant-numeric:tabular-nums}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--accent);box-shadow:0 0 0 1px var(--line)}
.seg button[aria-pressed="true"] b{color:var(--accent)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fsum{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:26px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.fsum .txt{height:26px;padding:0 6px;color:var(--accent)}
.fbar{display:flex;align-items:center;gap:4px}
.fbar select{flex:1;min-width:0;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:500 13px var(--ui);padding:0 8px}
.finput{display:flex;gap:6px}
.finput input{flex:1;min-width:0;height:32px;border:1px solid var(--accent);border-radius:8px;background:var(--panel);color:var(--ink);font:13px var(--ui);padding:0 8px;-webkit-user-select:text;user-select:text}
.chips{display:flex;gap:6px;padding:0 16px 10px;flex-wrap:wrap}
.chip2{border:1px solid var(--line);background:transparent;border-radius:16px;height:28px;padding:0 10px;font:500 12px var(--ui);cursor:pointer;color:var(--muted);font-variant-numeric:tabular-nums}
.chip2[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tklist{flex:1;overflow-y:auto;padding:4px 12px 16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.tkempty{color:var(--muted);font-size:13px;padding:16px 6px;line-height:1.5}
.tkempty b{color:var(--ink)}
.tkt{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--panel);position:relative}
.tkt[data-s="autorizado"]{border-color:var(--ok);background:var(--ok-soft)}
.tkt[data-s="rejeitado"]{border-color:var(--bad);background:var(--bad-soft)}
.tkt.dragging{opacity:.4}
.tkt .top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font:600 11px var(--ui);letter-spacing:.03em;border-radius:5px;padding:2px 7px;background:var(--hover);color:var(--muted)}
.st{font:600 11px var(--ui);border-radius:5px;padding:2px 7px;margin-left:auto}
.st[data-s="pendente"]{background:var(--wait-soft);color:var(--wait)}
.st[data-s="autorizado"]{background:var(--ok);color:#fff}
.st[data-s="rejeitado"]{background:var(--bad);color:#fff}
.claim{font:600 14px/1.4 var(--ui);color:var(--ink);overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.quote{margin:0;padding-left:10px;border-left:3px solid var(--line);font:italic 13px/1.45 var(--ui);color:var(--muted);overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ab{height:30px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 12px var(--ui);padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;text-decoration:none}
.ab:hover{background:var(--hover)}
.ab:disabled{opacity:.45;cursor:not-allowed}
.ab.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.ab.bad{color:var(--bad);border-color:var(--bad)}
.ab.okline{color:var(--ok);border-color:var(--ok)}
.ab.okarmed{background:var(--ok);border-color:var(--ok);color:#fff}
.ab.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.ab svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ab.icon{width:30px;padding:0;justify-content:center;margin-left:auto}
.grip{cursor:grab;touch-action:none;display:flex;align-items:center;gap:6px;font:600 12px var(--ui);color:var(--ok);border:1px dashed var(--ok);border-radius:7px;height:30px;padding:0 10px}
.grip svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.hintline{font-size:12px;color:var(--muted)}
/* prioridade de revisão (pesquisa-rastreavel): individual = Atenção (abrir a fonte); lote = Rotina (autorizar em grupo) */
.lvl{font:600 11px var(--ui);letter-spacing:.03em;border-radius:5px;padding:2px 7px}
.lvl[data-l="individual"]{background:var(--accent-soft);color:var(--accent)}
.lvl[data-l="lote"]{background:var(--hover);color:var(--muted)}
.qline{font-size:12px;line-height:1.45;color:var(--muted);overflow-wrap:anywhere}
.qline b{font-weight:600;color:var(--ink)}
.lotebar{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--hover)}
.lotebar p{margin:0;font-size:13px;line-height:1.45;color:var(--ink)}
.lotebar p small{display:block;margin-top:2px;font-size:12px;color:var(--muted)}
.why{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.why input{flex:1 1 160px;min-width:0;height:30px;border:1px solid var(--accent);border-radius:7px;background:var(--panel);color:var(--ink);font:13px var(--ui);padding:0 8px;-webkit-user-select:text;user-select:text}
/* tickets agrupados por fonte */
.gbar{display:flex;gap:2px;justify-content:flex-end;margin:-4px 0 -2px}
.gbar .txt{height:26px;font-size:12px}
.grp{display:flex;flex-direction:column;gap:8px}
.gh{display:flex;align-items:center;gap:8px;min-width:0}
.gtog{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:transparent;border-radius:8px;padding:6px 6px 6px 2px;cursor:pointer;text-align:left}
.gtog:hover{background:var(--hover)}
.gtog:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.gtog .chev{width:16px;height:16px;flex:none;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.grp[data-open="true"] .gtog .chev{transform:rotate(90deg)}
.gname{display:flex;flex-direction:column;min-width:0}
.gname b{font:600 14px/1.3 var(--ui);color:var(--ink);overflow-wrap:anywhere}
.gname small{font:400 12px/1.35 var(--ui);color:var(--muted);overflow-wrap:anywhere}
.gh .ab{flex:none}
.gbody{display:flex;flex-direction:column;gap:10px;margin-left:10px;padding-left:10px;border-left:1px solid var(--line)}
.ghost{position:fixed;z-index:60;pointer-events:none;width:240px;padding:10px 12px;border:2px solid var(--ok);border-radius:10px;background:var(--panel);box-shadow:var(--shadow);font:600 13px var(--ui);color:var(--ink);transform:translate(-50%,-50%) rotate(-2deg)}
.ghost small{display:block;font-weight:500;color:var(--muted);margin-top:4px}
@media (max-width:640px){
  #tk{top:auto;left:16px;right:16px;bottom:16px;width:auto;height:72%}
  #stage.tk-open .zoombar{right:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="stage">
  <svg id="board" role="application" aria-label="Quadro branco" tabindex="0">
    <defs>
      <pattern id="dotp" patternUnits="userSpaceOnUse" width="24" height="24">
        <circle id="dotc" cx="12" cy="12" r="1.2" style="fill:var(--dot)"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#dotp)"/>
    <g id="world"></g>
  </svg>

  <div class="topleft panel">
    <button class="tb" type="button" id="menuBtn" title="Menu" aria-label="Menu"></button>
    <input class="title" id="title" type="text" value="Quadro sem título" maxlength="80" aria-label="Nome do quadro" spellcheck="false">
    <button class="tb" type="button" id="boardsBtn" title="Meus quadros" aria-label="Meus quadros"></button>
  </div>
  <div class="topright panel" id="status"><span class="dot" id="sdot" data-s="connecting"></span><span id="stext">Conectando…</span><button class="tkbtn" type="button" id="tkBtn" title="Tickets de pesquisa" aria-label="Tickets de pesquisa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7a2 2 0 012-2h12a2 2 0 012 2v2a2 2 0 000 4v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2a2 2 0 000-4z"/><path d="M14 5v12"/></svg>Fontes<span class="n" id="tkN"></span></button></div>

  <div class="hint" id="hint">
    <div>
      <h1>Quadro em branco</h1>
      <p>Use a barra à esquerda para criar notas, formas, textos e conectores. Arraste de um ponto azul de uma forma para ligá-la a outra. Espaço + arrastar move o quadro.</p>
    </div>
  </div>

  <div class="rail panel" id="rail" role="toolbar" aria-label="Ferramentas"></div>
  <div class="ctx panel" id="ctx" hidden></div>
  <div class="pop panel" id="pop" hidden></div>

  <aside id="tk" class="panel" hidden aria-label="Tickets de pesquisa"></aside>
  <div id="mini" class="panel"><canvas id="miniC" width="352" height="224"></canvas></div>
  <div class="zoombar panel">

    if(objs.has(id)){

      if(o.type==='connector'){for(const e of [o.a,o.b]){if(e.id&&objs.has(e.id)){const p=sidePt(objs.get(e.id),e.side);e.x=r1(p[0]);e.y=r1(p[1])}}}
      after=J(o);
    }
    if(before!==after){patch.push({id:id,before:before,after:after});if(after===null)base.delete(id);else base.set(id,after);queueWrite(id)}
  });
  touched=new Set();
  if(patch.length){undoS.push(patch);if(undoS.length>150)undoS.shift();redoS=[]}
  updateUI();
}
function applyPatch(patch,key){
  patch.forEach(e=>{
    const v=e[key];
    if(v===null){objs.delete(e.id);base.delete(e.id);sel.delete(e.id)}
    else{const o=JSON.parse(v);objs.set(e.id,o);base.set(e.id,v);bumpZ(o.z)}
    queueWrite(e.id);
  });
}
function undo(){
  commitEdit();if(!undoS.length)return;
  const p=undoS.pop();applyPatch(p,'before');redoS.push(p);render();updateUI();
}
function redo(){
  commitEdit();if(!redoS.length)return;
  const p=redoS.pop();applyPatch(p,'after');undoS.push(p);render();updateUI();
}
async function flush(){
  if(flushing){flushT=setTimeout(flush,200);return}
  flushing=true;setStatus('saving');
  try{
    while(pendingW.size){
      const ids=Array.from(pendingW).slice(0,8);ids.forEach(i=>pendingW.delete(i));
      if(COL){
        await Promise.all(ids.map(id=>{
          const o=objs.get(id);
          if(o){const d=clone(o);delete d.id;return COL.doc(id).set(d)}
          return COL.doc(id).delete();
        }));
      }
    }
    if(COL)setStatus('saved');
    else{saveLocal();setStatus('local')}
  }catch(e){
    if(e&&e.code==='invalid_argument'){RO=true;setStatus('readonly');applyRO()}
    else if(e&&e.code==='quota_exceeded'){setStatus('error');toast('Limite de armazenamento do quadro atingido.')}
    else{setStatus('error');if(COL)ids_retry()}
  }
  flushing=false;
}
function ids_retry(){setTimeout(()=>{if(pendingW.size||true){objs.forEach((o,id)=>{if(!base.has(id)||base.get(id)!==J(o))pendingW.add(id)});if(pendingW.size)flush()}},4000)}
/* ----- vários quadros ----- */
const LBOARDS='quadro-boards-v1', LCUR='quadro-atual-v1';

function applyRemote(snap){
  let changed=false;
  snap.docChanges().forEach(ch=>{
    const id=ch.doc.id;
    if(ch.type==='removed'){
      if(!busy(id)&&objs.has(id)){objs.delete(id);base.delete(id);sel.delete(id);changed=true}
      return;
    }
    if(ch.doc.metadata&&ch.doc.metadata.hasPendingWrites)return;
    if(busy(id))return;
    const o=clean(ch.doc.data(),id);
    if(!o)return;
    const j=J(o);
    if(base.get(id)===j&&objs.has(id))return;
    objs.set(id,o);base.set(id,j);bumpZ(o.z);changed=true;
  });
  if(changed){
    sel.forEach(id=>{if(!objs.has(id))sel.delete(id)});
    render();updateUI();
  }
}
async function settle(){
  commitEdit();clearTimeout(flushT);

}
async function openBoard(id,isNew){

async function initStore(){

  }
  DB=dbns;META=DB.doc('meta/board');

    BOARDS=snap.docs.filter(d=>d.exists).map(d=>cleanBoard(d.id,d.data()));
    creating.forEach(id=>{if(!BOARDS.some(b=>b.id===id))BOARDS.push({id:id,title:'Quadro sem título',created:Date.now()});else creating.delete(id)});
    boardsSeen=true;showTitle();if(popName==='boards')renderPop();
    if(!opened){opened=true;openBoard(BOARDS.some(b=>b.id===start)?start:'main')}
    else if(BOARD!=='main'&&!snap.metadata.fromCache&&!BOARDS.some(b=>b.id===BOARD)){toast('Este quadro foi excluído.');openBoard('main')}
  },()=>{if(!opened){opened=true;openBoard('main')}});
  // Migração única: rascunho antigo salvo só neste navegador vai para o quadro principal se ele estiver vazio.
  setTimeout(()=>{
    try{
      if(BOARD==='main'&&objs.size===0&&!RO){
        const s=JSON.parse(localStorage.getItem(KEY)||'null');
        if(s&&Array.isArray(s.objs)&&s.objs.length){
          s.objs.forEach(d=>{const o=clean(d,String(d.id));if(o){objs.set(o.id,o);touch(o.id)}});
          commit();render();updateUI();fitIfNeeded(true);
          localStorage.removeItem(KEY);

/* ===== Remoção, clonagem e ordem ===== */
function removeObjs(ids){
  ids=Array.from(ids);
  ids.forEach(id=>{
    const t=objs.get(id);if(!t)return;
    if(isNode(t)){
      objs.forEach(c=>{
        if(c.type!=='connector')return;
        for(const k of ['a','b']){
          if(c[k].id===id){const p=sidePt(t,c[k].side);c[k]={id:null,side:'r',x:r1(p[0]),y:r1(p[1])};touch(c.id)}
        }
      });
    }
  });
  ids.forEach(id=>{objs.delete(id);sel.delete(id);touch(id)});
}
function cloneSet(list,dx,dy){
  const map=new Map(),out=[];
  list.forEach(o=>map.set(o.id,nid()));
  list.forEach(o=>{
    const c=clone(o);c.id=map.get(o.id);c.z=++zTop;c.locked=false;
    if(c.type==='pen'){c.pts=c.pts.map(p=>[r1(p[0]+dx),r1(p[1]+dy)])}
    else if(c.type==='connector'){
      for(const k of ['a','b']){
        const e=c[k];
        if(e.id&&map.has(e.id)){e.id=map.get(e.id)}
        else{const p=endpoint(o[k]);c[k]={id:null,side:'r',x:r1(p.x+dx),y:r1(p.y+dy)}}
      }
    }else{c.x+=dx;c.y+=dy}
    out.push(c);
  });
  return out;
}
function selObjs(){return Array.from(sel).map(id=>objs.get(id)).filter(Boolean)}
function selBox(list){
  list=list||selObjs();if(!list.length)return null;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  list.forEach(o=>{const b=bbox(o);x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h)});
  return {x:x0,y:y0,w:x1-x0,h:y1-y0};
}
function reorder(front){
  selObjs().forEach(o=>{
    if(front)o.z=++zTop;
    else{let m=1e15;objs.forEach(q=>{m=Math.min(m,q.z)});o.z=m-1}
    touch(o.id);
  });
  commit();render();
}

/* ===== Desenho ===== */
const fillCss=(f)=>f==='none'||!f?'transparent':col(f);
function shapeEl(o,style){
  const x=o.x,y=o.y,w=o.w,h=o.h,pts=(a)=>'<polygon points="'+a.map(p=>r1(p[0])+','+r1(p[1])).join(' ')+'" style="'+style+'"/>';
  switch(o.shape){
    case 'round':return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+Math.min(28,h/3)+'" style="'+style+'"/>';
    case 'ellipse':return '<ellipse cx="'+(x+w/2)+'" cy="'+(y+h/2)+'" rx="'+(w/2)+'" ry="'+(h/2)+'" style="'+style+'"/>';
    case 'diamond':return pts([[x+w/2,y],[x+w,y+h/2],[x+w/2,y+h],[x,y+h/2]]);
    case 'triangle':return pts([[x+w/2,y],[x+w,y+h],[x,y+h]]);
    case 'hexagon':return pts([[x+w*.22,y],[x+w*.78,y],[x+w,y+h/2],[x+w*.78,y+h],[x+w*.22,y+h],[x,y+h/2]]);
    case 'parallelogram':return pts([[x+w*.22,y],[x+w,y],[x+w*.78,y+h],[x,y+h]]);
    case 'arrowr':return pts([[x,y+h*.3],[x+w*.6,y+h*.3],[x+w*.6,y],[x+w,y+h/2],[x+w*.6,y+h],[x+w*.6,y+h*.7],[x,y+h*.7]]);
    case 'star':{
      const cx=x+w/2,cy=y+h/2,a=[];
      for(let i=0;i<10;i++){const r=i%2?0.42:1,t=-Math.PI/2+i*Math.PI/5;a.push([cx+Math.cos(t)*w/2*r,cy+Math.sin(t)*h/2*r])}
      return pts(a);
    }
    default:return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="2" style="'+style+'"/>';
  }
}
function textSvg(o){
  if(o.id===editing||!o.text)return '';
  const fs=defFs(o),lh=fs*1.35,font=fontOf(fs,o.bold);
  let lines,x,top,anchor,color;
  if(o.type==='text'){
    lines=wrap(o.text,480,font);const al=o.align||'left';
    anchor=al==='left'?'start':al==='right'?'end':'middle';
    x=al==='left'?o.x+4:al==='right'?o.x+o.w-4:o.x+o.w/2;top=o.y+3;color=col(o.color);
  }else{
    const iw=innerW(o);lines=wrap(o.text,iw,font);const al=o.align||'center';
    anchor=al==='left'?'start':al==='right'?'end':'middle';
    x=al==='left'?o.x+(o.w-iw)/2:al==='right'?o.x+(o.w+iw)/2:o.x+o.w/2;
    top=o.y+(o.h-lines.length*lh)/2+(VOFF[o.shape]||0)*o.h;
    if(o.type==='sticky')top=Math.max(top,o.y+12);
    color=o.type==='sticky'?'#1d2127':autoTextColor(o.fill);
  }
  return lines.map((l,i)=>'<text x="'+r1(x)+'" y="'+r1(top+i*lh+fs*.98)+'" text-anchor="'+anchor+'" font-family="'+FF+'" font-size="'+fs+'" font-weight="'+(o.bold?600:400)+'" pointer-events="none" style="fill:'+color+';white-space:pre">'+esc(l)+'</text>').join('');
}
function drawObj(o){
  const id='data-id="'+o.id+'"';
  switch(o.type){
    case 'pen':{
      const d=pathD(o.pts),w=o.hl?o.sw*4:o.sw;
      return '<g '+id+'><path d="'+d+'" fill="none" stroke-linecap="round" stroke-linejoin="round" style="stroke:transparent;stroke-width:'+Math.max(16,w)+'px;pointer-events:stroke"/><path d="'+d+'" fill="none" stroke-linecap="round" stroke-linejoin="round" pointer-events="none" style="stroke:'+col(o.color)+';stroke-width:'+w+'px;stroke-opacity:'+(o.hl?.35:1)+'"/></g>';
    }
    case 'connector':{
      const g=connGeom(o),c=col(o.color),sw=o.sw;
      let h='';
      if(o.arrow==='end'||o.arrow==='both')h+='<path d="'+headPath(g.B.x,g.B.y,g.ha,sw)+'" pointer-events="none" style="fill:'+c+';stroke:'+c+';stroke-width:1px;stroke-linejoin:round"/>';
      if(o.arrow==='both')h+='<path d="'+headPath(g.A.x,g.A.y,g.ta,sw)+'" pointer-events="none" style="fill:'+c+';stroke:'+c+';stroke-width:1px;stroke-linejoin:round"/>';
      return '<g '+id+'><path d="'+g.d+'" fill="none" stroke-linecap="round" stroke-linejoin="round" style="stroke:transparent;stroke-width:16px;pointer-events:stroke"/><path d="'+g.d+'" fill="none" stroke-linecap="round" stroke-linejoin="round" pointer-events="none" '+(o.dash?'stroke-dasharray="'+sw*3+' '+sw*2.5+'" ':'')+'style="stroke:'+c+';stroke-width:'+sw+'px"/>'+h+'</g>';
    }
    case 'frame':{
      const f=o.fill==='none'?'var(--frame)':col(o.fill);
      const title=o.text||'Moldura',showT=o.id!==editing;
      return '<g '+id+'><rect x="'+o.x+'" y="'+o.y+'" width="'+o.w+'" height="'+o.h+'" rx="4" style="fill:'+f+';stroke:var(--frame-line);stroke-width:1.5px;pointer-events:stroke"/>'+
        '<rect x="'+o.x+'" y="'+(o.y-30)+'" width="'+o.w+'" height="30" fill="transparent"/>'+
        (showT?'<text x="'+o.x+'" y="'+(o.y-10)+'" font-family="'+FF+'" font-size="16" font-weight="600" pointer-events="none" style="fill:'+(o.text?'var(--ink)':'var(--muted)')+'">'+esc(title)+'</text>':'')+'</g>';
    }
    case 'card':return drawCard(o);
    case 'image':
      return '<g '+id+'><image href="/_blob/'+o.asset+'" x="'+o.x+'" y="'+o.y+'" width="'+o.w+'" height="'+o.h+'" preserveAspectRatio="none"/></g>';
    case 'sticky':
      return '<g '+id+'><rect x="'+(o.x+2)+'" y="'+(o.y+5)+'" width="'+o.w+'" height="'+o.h+'" rx="3" fill="rgba(20,24,40,.16)" pointer-events="none"/><rect x="'+o.x+'" y="'+o.y+'" width="'+o.w+'" height="'+o.h+'" rx="3" style="fill:'+col(o.fill)+'"/>'+textSvg(o)+'</g>';
    case 'shape':{
      const st='fill:'+fillCss(o.fill)+';stroke:'+col(o.stroke)+';stroke-width:'+o.sw+'px;stroke-linejoin:round';
      return '<g '+id+'>'+shapeEl(o,st)+textSvg(o)+'</g>';
    }
    case 'text':
      return '<g '+id+'><rect x="'+o.x+'" y="'+o.y+'" width="'+o.w+'" height="'+o.h+'" fill="transparent"/>'+textSvg(o)+'</g>';
  }
  return '';
}
function overlay(){
  const k=view.k;let s='';
  const list=selObjs();

  if(editing==null&&list.length){
    if(list.length>1){list.forEach(o=>{s+=hl(bbox(o),'var(--sel)',true)});}

      if(!o.locked&&(o.type==='sticky'||o.type==='shape'||o.type==='frame'||o.type==='image'||o.type==='card')&&tool==='select'){
        s+=hd('nw',o.x,o.y)+hd('ne',o.x+o.w,o.y)+hd('sw',o.x,o.y+o.h)+hd('se',o.x+o.w,o.y+o.h);
      }
      if(isNode(o)&&tool==='select'&&!drag){
        for(const sd of ['t','r','b','l']){
          const p=sidePt(o,sd),d=DIR[sd];
          s+='<circle data-conn="'+sd+'" cx="'+(p[0]+d[0]*16/k)+'" cy="'+(p[1]+d[1]*16/k)+'" r="'+(6/k)+'" style="fill:var(--sel);stroke:var(--panel);stroke-width:'+(2/k)+'px;cursor:crosshair"/>';
        }
      }
      if(o.type==='connector'&&!o.locked){
        const g=connGeom(o);
        for(const e of [['a',g.A],['b',g.B]])s+='<circle data-end="'+e[0]+'" cx="'+e[1].x+'" cy="'+e[1].y+'" r="'+(7/k)+'" style="fill:var(--panel);stroke:var(--sel);stroke-width:'+(2/k)+'px;cursor:grab"/>';
      }

function setProp(prop,val){
  const list=selObjs().filter(o=>!(o.locked&&prop!=='locked'));
  list.forEach(o=>{
    const ok=(prop==='fill'&&(o.type==='sticky'||o.type==='shape'||o.type==='frame'))||
      ((prop==='stroke'||prop==='shape')&&o.type==='shape')||
      (prop==='sw'&&(o.type==='shape'||o.type==='pen'||o.type==='connector'))||
      (prop==='color'&&(o.type==='text'||o.type==='pen'||o.type==='connector'))||
      ((prop==='fs'||prop==='bold'||prop==='align')&&(o.type==='sticky'||o.type==='shape'||o.type==='text'))||
      ((prop==='style'||prop==='arrow'||prop==='dash')&&o.type==='connector');
    if(!ok)return;
    o[prop]=val;
    if(o.type==='text'&&(prop==='fs'||prop==='bold'))sizeText(o);
    touch(o.id);
  });
  commit();render();updateUI();

function editorGeom(o,text){
  const k=view.k,fs=defFs(o),lh=fs*1.35;
  if(o.type==='frame')return {x:o.x,y:o.y-27,w:Math.max(160,o.w),h:22,fs:16,lh:20,al:'left',bold:true};
  const bold=!!o.bold;
  if(o.type==='text'){
    const al=o.align||'left',n=Math.max(1,wrap(text,480,fontOf(fs,bold)).length);
    const x=al==='left'?o.x+4:al==='right'?o.x+o.w-480-4:o.x+o.w/2-240;
    return {x:x,y:o.y+3,w:480,h:n*lh,fs:fs,lh:lh,al:al,bold:bold};
  }
  const iw=innerW(o),n=Math.max(1,wrap(text,iw,fontOf(fs,bold)).length);
  let y=o.y+(o.h-n*lh)/2+(VOFF[o.shape]||0)*o.h;
  if(o.type==='sticky')y=Math.max(y,o.y+12);
  return {x:o.x+(o.w-iw)/2,y:y,w:iw,h:n*lh,fs:fs,lh:lh,al:o.align||'center',bold:bold};
}

  const o=objs.get(editing);if(!o)return;
  const g=editorGeom(o,ta.value),k=view.k;
  const color=o.type==='sticky'?'#1d2127':o.type==='text'?col(o.color):o.type==='shape'?autoTextColor(o.fill):'var(--ink)';
  ta.style.cssText='left:'+(view.x+g.x*k)+'px;top:'+(view.y+g.y*k)+'px;width:'+(g.w*k)+'px;height:'+(g.h*k)+'px;font:'+(g.bold?600:400)+' '+(g.fs*k)+'px/'+(g.lh*k)+'px '+FF+';text-align:'+g.al+';color:'+color;
}
function startEdit(id,isNew){
  const o=objs.get(id);
  if(!o||RO||(o.locked&&!isNew)||['sticky','shape','text','frame'].indexOf(o.type)<0)return;
  commitEdit();
  editing=id;editNew=!!isNew;editOld=o.text||'';sel=new Set([id]);
  ta.hidden=false;ta.value=o.text||'';
  positionEditor();render();updateUI();
  ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
}
ta.addEventListener('input',positionEditor);
ta.addEventListener('blur',()=>commitEdit());
ta.addEventListener('keydown',e=>{
  if(e.key==='Escape'){e.preventDefault();commitEdit()}
  else if(e.key==='Enter'&&(e.ctrlKey||e.metaKey||(objs.get(editing)||{}).type==='frame')){e.preventDefault();commitEdit()}
  e.stopPropagation();
});
function commitEdit(){
  if(editing==null)return;
  const id=editing,o=objs.get(id);editing=null;ta.hidden=true;
  if(o){
    const changed=ta.value!==editOld;
    o.text=ta.value;
    if(o.type==='text'){
      if(!o.text.trim()){removeObjs([id])}
      else sizeText(o);
    }
    if(changed||editNew)touch(id);
    commit();
  }
  render();updateUI();
}

function zoomAt(sx,sy,f){
  const k2=clamp(view.k*f,0.1,4),wx=(sx-view.x)/view.k,wy=(sy-view.y)/view.k;
  view.x=sx-wx*k2;view.y=sy-wy*k2;view.k=k2;render();updateUI();saveView();
}
function centerPt(){return [stage.clientWidth/2,stage.clientHeight/2]}
function fitView(){
  const list=Array.from(objs.values());
  const w=stage.clientWidth,h=stage.clientHeight;
  if(!list.length){view={x:w/2,y:h/2,k:1};render();updateUI();saveView();return}
  const b=selBox(list),padL=window.innerWidth<=640?24:110,pad=60;
  const k=clamp(Math.min((w-padL-pad)/Math.max(b.w,1),(h-pad*2-60)/Math.max(b.h,1)),0.1,1.5);
  view.k=k;view.x=padL+((w-padL-pad)-b.w*k)/2-b.x*k;view.y=(h-b.h*k)/2-b.y*k+10;
  render();updateUI();saveView();
}

let miniMap=null,miniDrag=false;
function drawMini(){
  const c=miniC,g=c.getContext('2d'),W=c.width,H=c.height;
  g.clearRect(0,0,W,H);
  const cs=getComputedStyle(document.documentElement);
  const muted=cs.getPropertyValue('--muted').trim()||'#667085',acc=cs.getPropertyValue('--accent').trim()||'#4262ff';
  const r=svg.getBoundingClientRect();
  const vp={x:-view.x/view.k,y:-view.y/view.k,w:r.width/view.k,h:r.height/view.k};
  let x0=vp.x,y0=vp.y,x1=vp.x+vp.w,y1=vp.y+vp.h;
  objs.forEach(o=>{const b=bbox(o);x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h)});
  const pad=40;x0-=pad;y0-=pad;x1+=pad;y1+=pad;
  const s=Math.min(W/(x1-x0),H/(y1-y0)),ox=(W-(x1-x0)*s)/2-x0*s,oy=(H-(y1-y0)*s)/2-y0*s;
  miniMap={s:s,ox:ox,oy:oy};
  objs.forEach(o=>{
    if(o.type==='connector')return;
    const b=bbox(o);
    g.globalAlpha=o.type==='frame'?.25:.7;
    g.fillStyle=(o.type==='sticky'||(o.type==='shape'&&o.fill&&o.fill!=='none'&&o.fill!=='ink'))?o.fill:muted;
    g.fillRect(b.x*s+ox,b.y*s+oy,Math.max(2,b.w*s),Math.max(2,b.h*s));
  });
  g.globalAlpha=1;g.strokeStyle=acc;g.lineWidth=3;g.fillStyle=acc;
  g.globalAlpha=.12;g.fillRect(vp.x*s+ox,vp.y*s+oy,vp.w*s,vp.h*s);g.globalAlpha=1;
  g.strokeRect(vp.x*s+ox,vp.y*s+oy,vp.w*s,vp.h*s);
}
function miniGo(e){
  if(!miniMap)return;
  const r=mini.getBoundingClientRect(),f=miniC.width/r.width;
  const px=(e.clientX-r.left)*f,py=(e.clientY-r.top)*f;
  const wx=(px-miniMap.ox)/miniMap.s,wy=(py-miniMap.oy)/miniMap.s;
  view.x=stage.clientWidth/2-wx*view.k;view.y=stage.clientHeight/2-wy*view.k;render();saveView();
}
mini.addEventListener('pointerdown',e=>{miniDrag=true;mini.setPointerCapture(e.pointerId);miniGo(e)});
mini.addEventListener('pointermove',e=>{if(miniDrag)miniGo(e)});
mini.addEventListener('pointerup',()=>{miniDrag=false});

let ASSETS=null,assetsTried=false;

function loadImg(url){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url})}
async function addImageFile(file,at){
  if(RO)return;
  const a=await getAssets();if(!a){toast('Envio de imagens indisponível nesta visualização.');return}
  if(!/^image\//.test(file.type)){toast('Esse arquivo não é uma imagem.');return}
  try{
    const url=URL.createObjectURL(file);let im;
    try{im=await loadImg(url)}finally{URL.revokeObjectURL(url)}
    let blob=file;
    const ok=['image/png','image/jpeg','image/gif','image/webp','image/svg+xml'].indexOf(file.type)>=0;
    if(!ok||(file.size>1500000&&file.type!=='image/gif')){
      const m=Math.min(1,2200/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');
      c.width=Math.round(im.naturalWidth*m);c.height=Math.round(im.naturalHeight*m);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.88));
    }
    toast('Enviando imagem…');
    const up=await a.upload(blob);
    const nw=im.naturalWidth||400,nh=im.naturalHeight||300,s=Math.min(1,480/Math.max(nw,nh));
    const w=Math.round(nw*s),h=Math.round(nh*s);
    const k=view.k,cx=at?at.x:(stage.clientWidth/2-view.x)/k,cy=at?at.y:(stage.clientHeight/2-view.y)/k;
    const o=mk('image',{x:r1(cx-w/2),y:r1(cy-h/2),w:w,h:h,asset:up.id});
    sel=new Set([o.id]);tool='select';commit();render();updateUI();
  }catch(e){toast(e&&e.code==='too_large'?'Imagem grande demais.':'Não foi possível enviar a imagem.')}
}

async function boardSvg(){
  const list=ordered();if(!list.length)return null;
  const b=selBox(list),pad=48,cs=getComputedStyle(document.documentElement);
  const tok={ok:'--ok',bad:'--bad',wait:'--wait','bad-soft':'--bad-soft','ok-soft':'--ok-soft',hover:'--hover',ink:'--ink',panel:'--panel',muted:'--muted',accent:'--accent','frame-line':'--frame-line',frame:'--frame','accent-soft':'--accent-soft',sel:'--sel'};
  let inner=list.map(drawObj).join('');
  for(const t in tok)inner=inner.split('var(--'+t+')').join(cs.getPropertyValue(tok[t]).trim()||'#000');
  const ids=Array.from(new Set((inner.match(/href="\/_blob\/[0-9a-f]{32}"/g)||[])));
  for(const h of ids){
    const id=h.slice(14,-1);let data='';
    try{
      const r=await fetch('/_blob/'+id),bl=await r.blob();
      data=await new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result);f.readAsDataURL(bl)});
    }catch(e){}
    inner=inner.split(h).join('href="'+data+'"');
  }
  const bg=cs.getPropertyValue('--bg').trim()||'#f4f5f8';
  const W=Math.ceil(b.w+pad*2),H=Math.ceil(b.h+pad*2);
  const s='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="'+(b.x-pad)+' '+(b.y-pad)+' '+W+' '+H+'"><rect x="'+(b.x-pad)+'" y="'+(b.y-pad)+'" width="'+W+'" height="'+H+'" fill="'+bg+'"/>'+inner+'</svg>';
  return {svg:s,w:W,h:H};
}
async function exportBoard(kind){
  let dl=null;
  try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads')}catch(e){}
  if(!dl){toast('Exportação indisponível nesta visualização.');return}
  const r=await boardSvg();if(!r){toast('O quadro está vazio.');return}
  const name=(boardTitle||'quadro').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').toLowerCase()||'quadro';
  try{
    if(kind==='svg'){await dl.save({filename:name+'.svg',data:r.svg});return}
    const sc=Math.min(2,8000/Math.max(r.w,r.h)),url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(r.svg);
    const im=await loadImg(url),c=document.createElement('canvas');
    c.width=Math.round(r.w*sc);c.height=Math.round(r.h*sc);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const blob=await new Promise(res=>c.toBlob(res,'image/png'));
    await dl.save({filename:name+'.png',data:blob});
  }catch(e){if(!e||e.code!=='declined')toast('Não foi possível exportar.')}
}

async function initTickets(){
  if(!DB){renderTk();return}
  try{USER=await window.claude.use('user');if(USER&&USER.id)myId=await USER.id()}catch(e){}
  DB.collection('tickets').onSnapshot(snap=>{
    const m=new Map();
    snap.docs.forEach(d=>{if(!d.exists)return;const t=cleanTicket(d.id,d.data());if(t)m.set(d.id,t)});
    TK=m;tkReady=true;resolveNames();renderTk();render();
  },()=>{tkReady=true;renderTk()});
  DB.collection('folders').onSnapshot(snap=>{
    FOLDERS=snap.docs.filter(d=>d.exists).map(d=>{const x=d.data()||{};return {id:d.id,name:(typeof x.name==='string'&&x.name.trim()?x.name:'Pasta').slice(0,60),created:Number(x.created)||0}});
    if(tkFolder!=='all'&&tkFolder!=='geral'&&!FOLDERS.some(f=>f.id===tkFolder)&&!(snap.metadata&&snap.metadata.fromCache)){tkFolder='all';saveTkUi()}
    renderTk();
  },()=>{});
}
async function resolveNames(){
  if(!USER||!USER.profiles)return;
  const ids=Array.from(new Set(Array.from(TK.values()).map(t=>t.decidedBy).filter(Boolean)));
  if(!ids.length)return;
  try{
    const ps=await USER.profiles(ids);let ch=false;
    ids.forEach(id=>{const n=(ps&&ps[id]&&ps[id].name)||'';if(names[id]!==n){names[id]=n;ch=true}});
    if(ch)renderTk();
  }catch(e){}
}

function groupsHtml(list){
  const gm=new Map();
  list.forEach(t=>{
    const nm=(t.source||host(t.url)||'Sem fonte').trim(),k=t.folder+'|'+nm.toLowerCase();
    let g=gm.get(k);if(!g){g={key:k,name:nm,items:[],newest:0};gm.set(k,g)}
    g.items.push(t);g.newest=Math.max(g.newest,t.created);
  });
  tkGroups=Array.from(gm.values()).sort((a,b)=>b.newest-a.newest);
  let h='';
  if(tkGroups.length>1)h+='<div class="gbar"><button class="txt" type="button" data-tkg="all-open">Expandir todas</button><button class="txt" type="button" data-tkg="all-close">Recolher todas</button></div>';
  return h+tkGroups.map((g,i)=>{
    const open=!tkCollapsed.has(g.key);
    const cnt={pendente:0,autorizado:0,rejeitado:0};g.items.forEach(t=>cnt[t.status]++);
    const sub=[g.items.length+(g.items.length===1?' ticket':' tickets')];
    if(cnt.pendente)sub.push(cnt.pendente+(cnt.pendente===1?' pendente':' pendentes'));
    if(cnt.autorizado)sub.push(cnt.autorizado+(cnt.autorizado===1?' autorizado':' autorizados'));
    if(cnt.rejeitado)sub.push(cnt.rejeitado+(cnt.rejeitado===1?' rejeitado':' rejeitados'));
    if(tkFolder==='all')sub.push('Pasta: '+folderName(g.items[0].folder));
    const bases=new Map();g.items.forEach(t=>{if(t.url){const b=t.url.split('#')[0];bases.set(b,(bases.get(b)||0)+1)}});
    let base='',best=0;bases.forEach((n,b)=>{if(n>best){best=n;base=b}});
    const all=g.items.every(t=>!t.url||checked.has(t.id));
    const link=base?'<a class="ab" href="'+esc(base)+'" target="_blank" rel="noopener noreferrer" data-tkg="visit" data-gi="'+i+'"'+(bases.size>1?' title="Abre a página mais citada ('+bases.size+' páginas nesta fonte). Use o botão de cada ticket para as demais."':'')+'>'+ico('ext')+(all?'Reabrir fonte':'Conferir fonte')+'</a>':'';
    return '<section class="grp" data-open="'+open+'"><div class="gh"><button class="gtog" type="button" data-tkg="toggle" data-gi="'+i+'" aria-expanded="'+open+'" aria-label="'+(open?'Minimizar ':'Expandir ')+esc(g.name)+'">'+
      '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><span class="gname"><b>'+esc(g.name)+'</b><small>'+esc(sub.join(' · '))+'</small></span></button>'+link+'</div>'+
      (open?'<div class="gbody">'+g.items.map(t=>ticketHtml(t,true)).join('')+'</div>':'')+'</section>';
  }).join('');
}

function arm(id,act){

function decide(t,st){

  if(st==='rejeitado'&&!RO){whyEdit={id:t.id,text:t.why||'',focus:true}}else if(whyEdit&&whyEdit.id===t.id)whyEdit=null;

async function authorizeLote(){
  if(RO||!DB)return;
  const list=Array.from(TK.values()).filter(t=>(tkFolder==='all'||t.folder===tkFolder)&&t.status==='pendente'&&t.nivel==='lote');
  if(!list.length)return;
  const now=Date.now(),p={status:'autorizado',decidedAt:now,decidedBy:myId||'',decidedBatch:true,redo:''};
  let ok=0;
  for(let i=0;i<list.length;i+=8){
    const r=await Promise.allSettled(list.slice(i,i+8).map(t=>DB.doc('tickets/'+t.id).update(p)));
    r.forEach(x=>{if(x.status==='fulfilled')ok++});
  }
  if(ok===list.length)toast(ok+(ok===1?' ticket autorizado':' tickets autorizados')+' de uma vez');
  else toast(ok+' de '+list.length+' autorizados. Tente de novo para os que faltaram.');
}

tkEl.addEventListener('click',e=>{
  const f=e.target.closest('[data-tkf]'),b=e.target.closest('[data-tk]'),v=e.target.closest('[data-tka]');
  if(f){tkFilter=f.dataset.tkf;saveTkUi();renderTk();return}
  const lv=e.target.closest('[data-tkl]');
  if(lv){tkLevel=lv.dataset.tkl;saveTkUi();renderTk();return}

    if(a==='close'){tkOpen=false;saveTkUi();renderTk();render()}
    else if(a==='fnew'){folderEdit={id:null,name:'',focus:true};tkArmed=null;renderTk()}
    else if(a==='fren'){folderEdit={id:tkFolder,name:folderName(tkFolder),focus:true};tkArmed=null;renderTk()}
    else if(a==='fcancel'){folderEdit=null;renderTk()}
    else if(a==='fsave')saveFolder();

    else if(a==='lote'){if(arm('','lote'))authorizeLote()}

    return;
  }
  const gEl=e.target.closest('[data-tkg]');
  if(gEl){
    const ga=gEl.dataset.tkg,g=tkGroups[+gEl.dataset.gi];
    if(ga==='toggle'&&g){if(tkCollapsed.has(g.key))tkCollapsed.delete(g.key);else tkCollapsed.add(g.key);saveGrp();renderTk()}
    else if(ga==='all-open'){tkCollapsed.clear();saveGrp();renderTk()}
    else if(ga==='all-close'){tkGroups.forEach(x=>tkCollapsed.add(x.key));saveGrp();renderTk()}
    else if(ga==='visit'&&g){
      g.items.forEach(t=>{if(t.url)checked.add(t.id)});
      try{localStorage.setItem('quadro-conferidos',J(Array.from(checked).slice(-500)))}catch(err){}
      setTimeout(renderTk,400);
    }
    return;
  }
  if(!v)return;
  const id=v.dataset.id,t=TK.get(id),act=v.dataset.tka;if(!t)return;
  if(act==='visit'){
    checked.add(id);try{localStorage.setItem('quadro-conferidos',J(Array.from(checked).slice(-500)))}catch(err){}
    setTimeout(renderTk,400);return;
  }
  if(act==='ok')decide(t,'autorizado');
  else if(act==='rej'||act==='rejsrc'){if(arm(id,act))decide(t,'rejeitado')}
  else if(act==='reauth'){if(arm(id,'reauth'))decide(t,'autorizado')}
  else if(act==='why'){whyEdit={id:id,text:t.why||'',focus:true};renderTk()}
  else if(act==='whysave')saveWhy(t);
  else if(act==='whycancel'){whyEdit=null;renderTk()}
  else if(act==='redo')tkUpdate(t,{redo:'pedido'},'Pedido registrado. No chat, diga “atualiza os tickets do quadro”.');
  else if(act==='del'){if(arm(id,'del')){if(DB)DB.doc('tickets/'+id).delete().then(()=>toast('Ticket excluído'),()=>toast('Não foi possível excluir.'))}}
});

const DROPPABLE=['sticky','card','shape','text'];
function boardPoint(e){
  const el=document.elementFromPoint(e.clientX,e.clientY);
  if(!el||!el.closest||!el.closest('#board'))return null;
  const r=svg.getBoundingClientRect();return toW(e.clientX-r.left,e.clientY-r.top);
}
function dropTargetAt(p){
  if(!p)return null;
  const n=nodeAt(p.x,p.y);
  return n&&DROPPABLE.indexOf(n.type)>=0&&!n.locked?n:null;
}
tkEl.addEventListener('pointerdown',e=>{

addEventListener('pointermove',e=>{

  }

  const tg=dropTargetAt(boardPoint(e));

function endTkDrag(e,cancel){
  if(!tkDrag||e.pointerId!==tkDrag.pid)return;

  const items=(e.clipboardData&&e.clipboardData.items)||[];
  for(const it of items){
    if(it.kind==='file'&&/^image\//.test(it.type)){const f=it.getAsFile();if(f){e.preventDefault();addImageFile(f,null);return}}
  }
  e.preventDefault();pasteClip();
});
svg.addEventListener('dragover',e=>{e.preventDefault()});
svg.addEventListener('drop',e=>{
  e.preventDefault();if(RO)return;
  const q=pt(e),p=toW(q.sx,q.sy);
  const fs=e.dataTransfer&&e.dataTransfer.files;
  if(fs&&fs.length)Array.from(fs).filter(f=>/^image\//.test(f.type)).slice(0,5).forEach((f,i)=>addImageFile(f,{x:p.x+i*30,y:p.y+i*30}));
});
$('#title').addEventListener('change',saveTitle);
$('#title').addEventListener('blur',saveTitle);
addEventListener('resize',()=>{render()});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{render()})}catch(e){}
new MutationObserver(()=>render()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

buildRail();
view={x:stage.clientWidth/2,y:stage.clientHeight/2,k:1};
setCursor();render();updateUI();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>render());
initStore();
